<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IslandFlavaTour</title>

    <link rel="stylesheet" href="Stylesheets/footer-stylesheet.css">
    <link rel="stylesheet" href="Stylesheets/contact-stylesheet.css">

    <script src="https://kit.fontawesome.com/844ae0f91d.js" crossorigin="anonymous"></script>

</head>
<body>

     <header>
        <div class="logo">
            <img src="Assets/Business%20Logo.jpg">
        </div>

        <nav>
            <a href="index.html">Homepage</a>
            <a href="index.html#About">About</a>
            <a href="index.html#Tours">Tours</a>
            <!-- <a href="#">Gallery</a> -->
            <a href="index.html#Reviews">Reviews</a>
            <a href="Contact.html">Contact</a>
        </nav>
    </header> 
    

    <div id="Form">

            <div class="form-container">
                <h2>Contact Us</h2>

                <p>
                    Fill out this form and we will get in contact with you as soon as we can.

                </p>


                <form action="https://api.web3forms.com/submit" method="POST">

                    <input type="hidden" name="access_key" value="27f98239-1c67-4123-b92d-85cd0a53a37a">

                    <input type="text" id="fname" name="first_name" placeholder="Enter your first name">

                    <input type="text"  id="lname" name="last_name" placeholder="Enter your last name">

                    <input type="text" id="phone_number" name="phone_number" placeholder="Enter your phone number">

                    <input type="text" id="form_email" name="email" placeholder="Enter your email">

                    <textarea id="message" name="message" placeholder="Write your message here"></textarea>

                    <button type="submit">Send Message</button>
                </form>
            </div>
    </div>


    <footer class="footer">

        <div class="footer-content">
            <div class="footer-brand">
                <h2>Island Flava Tours</h2>
                <p>&copy; 2026 Island-Flava-Tours. All Rights Reserved. </p>
            </div>

            <div class="footer-socials">

                <p>Socials</p>

                <div class="social-icons">

                    <button onclick="togglePhone(event)">
                        <i class="fa-brands fa-whatsapp" style="font-size: x-large;"></i>
                    </button>

                    <span class="popup" id="phone">1876-909-9026</span>

                </div>

                <div class="social-icons">
                    <a href="https://www.instagram.com/islandflavatour/" target="_blank" rel="noopener noreferrer">
                        <i class="fa-brands fa-instagram social-icon" style="font-size: x-large;"></i>
                    </a>
                </div>

                <div class="social-icons">
                    <button onclick="toggleEmail(event)">
                        <i class="fa-regular fa-envelope" style="font-size: x-large;"></i>
                    </button>

                    <span class="popup" id="email">876islandflava@gmail.com</span>
                </div>

            </div>

        </div>
    </footer>


    <script src="Logic/script.js"></script>
</body>
</html>
