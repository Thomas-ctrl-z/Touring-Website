<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IslandFlavaTour</title>

    <link rel="stylesheet" href="Stylesheets/footer-stylesheet.css">
    <link rel="stylesheet" href="Stylesheets/contact-stylesheet.css">

    <script src="https://kit.fontawesome.com/844ae0f91d.js" crossorigin="anonymous"></script>

</head>
<body>

     <header>
        <div class="logo">
            <img src="Assets/Business%20Logo.jpg">
        </div>

        <nav>
            <a href="index.html">Homepage</a>
            <a href="#">About</a>
            <a href="#">Tours</a>
            <a href="#">Gallery</a>
            <a href="#">Reviews</a>
            <a href="Contact.html">Contact</a>
        </nav>
    </header> 
    

    <div id="Form">

            <div class="form-container">
                <h2>Contact Us</h2>

                <p>
                    Fill out this form and we will get in contact with you as soon as we can.

                </p>


                <form action="">

                    <label for="fname"></label>
                    <input type="text" id="fname" placeholder="Enter your first name">

                    <label for="lname"></label>
                    <input type="text"  id="lname" placeholder="Enter your last name">

                     <label for="phone_number"></label>
                    <input type="text" id="phone_number" placeholder="Enter your phone number">

                     <label for="email"></label>
                    <input type="text" id="email" placeholder="Enter your email">

                     <!-- <label for="message"></label>
                    <input type="text" id="message" placeholder="Write your message here"> -->

                    <textarea id="message" placeholder="Write your message here"></textarea>

                    <button type="submit">Send Message</button>
                </form>

            </div>
    </div>


    <footer class="footer">

        <div class="footer-content">
            <div class="footer-brand">
                <h2>Island Flava Tours</h2>
                <p>&copy; 2026 Island-Flava-Tours. All Rights Reserved. </p>
            </div>

            <div class="footer-socials">

                <p>Socials</p>

                <div class="social-icons">

                    <button onclick="togglePhone(event)">
                        <i class="fa-brands fa-whatsapp" style="font-size: x-large;"></i>
                    </button>

                    <span class="popup" id="phone">1876-909-9026</span>

                </div>

                <div class="social-icons">
                    <a href="https://www.instagram.com/islandflavatour/">
                        <i class="fa-brands fa-instagram social-icon" style="font-size: x-large;"></i>
                    </a>
                </div>

                <div class="social-icons">
                    <button onclick="toggleEmail(event)">
                        <i class="fa-regular fa-envelope" style="font-size: x-large;"></i>
                    </button>

                    <span class="popup" id="email">876islandflava@gmail.com</span>
                </div>

            </div>

        </div>
    </footer>


    <!-- <script src="Logic/script.js"> -->

    </script>
</body>
</html>
